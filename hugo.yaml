baseURL: https://jkulawik.github.io
locale: en-us
title: Sniper Monkey

module:
  imports:
    - path: github.com/imfing/hextra

params:
  description: "Yet another blog about tech and games (YABATAG)"
  blog:
    list:
      displayTags: true
  toc:
    displayTags: true
  imageZoom:
    enable: true
  navbar:
    displayLogo: true
    logo:
      path: favicon.svg
      dark: favicon-dark.svg
      width: 40
      height: 20

menu:
  main:
    - name: Home
      pageRef: /
      weight: 1
    - name: Blog
      pageRef: /posts
      weight: 2
    - name: Tags
      pageRef: /tags
      weight: 3
    - name: Lasaga
      pageRef: /lasaga
      weight: 3
    - name: GitHub
      weight: 10
      url: https://github.com/jkulawik
      params:
        icon: github
    - name: Twitter
      weight: 11
      url: https://twitter.com/JacobKLVK
      params:
        icon: twitter
    - name: Search
      weight: 20
      params:
        type: search
    - name: Theme Toggle
      weight: 30
      params:
        type: theme-toggle
        label: false # optional, default is false
